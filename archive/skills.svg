<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <style>
    
    .pf-header { animation: pf-pop 12s ease-out infinite; }
    .pf-underline { animation: pf-wipe 12s ease-out infinite; transform-origin: 36px center; }
    .pf-counter { animation: pf-pop 12s ease-out infinite; animation-delay: 0.60s; }
    .pf-tile { animation: pf-pop 12s ease-out infinite; }
    .pf-tile-0 { animation-delay: 0.96s; }
    .pf-tile-1 { animation-delay: 1.14s; }
    .pf-tile-2 { animation-delay: 1.32s; }
    .pf-tile-3 { animation-delay: 1.50s; }
    .pf-tile-4 { animation-delay: 1.68s; }
    .pf-tile-5 { animation-delay: 1.86s; }
    .pf-tile-6 { animation-delay: 2.04s; }
    .pf-tile-7 { animation-delay: 2.22s; }
    
    @keyframes pf-pop {
      0%, 6%   { opacity: 0; transform: translateY(-4px); }
      18%, 88% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 0; transform: translateY(0); }
    }
    @keyframes pf-wipe {
      0%, 10%  { transform: scaleX(0); }
      28%, 88% { transform: scaleX(1); }
      100%     { transform: scaleX(1); }
    }
  </style>

