    .pf-step-6 { animation: pf-step-6 7.800s steps(1, end) infinite; }

    @keyframes pf-pop {
      0%, 6%   { opacity: 0; transform: translateY(-4px); }
      18%, 88% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 0; transform: translateY(0); }
    }
    @keyframes pf-wipe-cycle {
      0% { transform: scaleX(0); }
      17.9487% { transform: scaleX(1); }
      82.0513% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
    @keyframes pf-step-0 {
