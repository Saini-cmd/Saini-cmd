    .pf-cloud { fill: var(--pf-cloud); }

    .pf-tile { animation: pf-pop var(--pf-duration) ease-out infinite; }
    .pf-icon { animation: none; }
    .pf-underline { animation: pf-wipe-cycle 7.800s ease-in-out infinite; transform-origin: 36px center; }
    .pf-step-0 { animation: pf-step-0 7.800s steps(1, end) infinite; }
